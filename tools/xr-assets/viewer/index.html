<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR asset viewer</title>
<script type="importmap">
{ "imports": {
  "three": "../node_modules/three/build/three.module.js",
  "three/addons/": "../node_modules/three/examples/jsm/"
} }
</script>
<style>
  :root { --paper:#f2efe7; --ink:#231e16; --muted:#857d6e; --rule:#ddd6c8; --accent:#f4b829; --panel:#f7f4ed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 12px; left: 12px; width: 268px; max-height: calc(100% - 24px); overflow: auto; background: color-mix(in srgb, var(--panel) 94%, transparent);
    border: 1.5px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px; }
  #ui h1 { font-size: 12px; margin: 0 0 8px; letter-spacing: .06em; text-transform: uppercase; }
  #ui label { display: block; margin: 8px 0 2px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #ui select, #ui input[type=range] { width: 100%; font: inherit; accent-color: var(--ink); }
  #ui select { padding: 3px 4px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  button[aria-pressed=true] { background: var(--accent); }
  .chk { display: flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 12px; }
  #parts { margin-top: 4px; border-top: 1px solid var(--rule); max-height: 34vh; overflow: auto; }
  #parts div { display: flex; gap: 6px; align-items: center; padding: 1px 2px; border-radius: 4px; cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #parts div:hover { background: var(--accent); }
  #parts small { color: var(--muted); }
  #stats { position: fixed; right: 12px; top: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: pre; color: var(--ink); text-shadow: 0 0 3px var(--paper), 0 0 6px var(--paper); }
  #tip { position: fixed; pointer-events: none; background: #fff4d6; border: 1.2px solid var(--ink); border-radius: 999px; padding: 1px 8px; font-weight: 700; display: none; }
  #msg { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: var(--muted); }
  html.shot #ui, html.shot #stats, html.shot #msg { display: none; }
  @media (max-width: 640px) { #ui { width: auto; right: 12px; max-height: 45%; } #stats { top: auto; bottom: 12px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <h1>XR asset viewer</h1>
  <label for="item">Item</label>
  <select id="item"></select>
  <label for="explode">Explode <span id="explodeV"></span></label>
  <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
  <label for="xr">See-through <span id="xrV"></span></label>
  <input id="xr" type="range" min="0" max="1" step="0.01" value="0">
  <div class="row">
    <button id="leds" aria-pressed="false">Flash LEDs</button>
    <button id="spin" aria-pressed="false">Spin motors</button>
    <button id="reset">View</button>
  </div>
  <div class="row" id="xrrow"></div>
  <label class="chk"><input id="anchors" type="checkbox"> anchors</label>
  <label class="chk"><input id="texts" type="checkbox"> printed text</label>
  <label>Parts <small id="partsN"></small></label>
  <div id="parts"></div>
</div>
<div id="stats"></div>
<div id="tip"></div>
<div id="msg"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
