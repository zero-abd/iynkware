name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Type-checking the app takes about 2.4 GB, over Node's default heap on a runner, for both tsc and the TypeScript step of next build.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  check:
    runs-on: ubuntu-latest
    # every step runs in turn on one runner, and the e2e suite covers Chromium, WebKit and Firefox
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: bash scripts/ci-local.sh
        env:
          # The save and Studio frame budgets need a quiet machine; the nightly Editor performance workflow runs them.
          IYNK_E2E_NO_PERF: "1"
      - name: Keep the e2e results of a failed run
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  perf-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_DIST_DIR: .next-perf
      PERF_BASE_URL: http://127.0.0.1:47500
      NEXT_PUBLIC_REALTIME_URL: ""
      IYNK_SERVER_TOKEN: ""
      IYNK_AI_ENABLE: ""
      IYNK_SEARCH_ENABLE: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure against budgets.json
        shell: bash
        run: |
          set -o pipefail
          npx next start --port 47500 &
          server=$!
          trap 'kill $server' EXIT
          node -e "const u=process.env.PERF_BASE_URL;(async()=>{for(let i=0;i<60;i++){try{if((await fetch(u)).status<500)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          npm run perf:budget | tee perf-budget.txt
          { echo '```'; cat perf-budget.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
