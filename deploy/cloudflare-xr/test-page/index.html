<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iynkware XR deploy test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101418;
        --fg: #e8ecef;
        --muted: #93a0aa;
        --accent: #ff7a1a;
        --ok: #5fd38a;
        --bad: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 system-ui, sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      main {
        position: relative;
        max-width: 34rem;
        padding: 1.5rem 1rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
      }
      button {
        min-width: 12rem;
        min-height: 3.5rem;
        padding: 0.75rem 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #1a0d00;
        font: 600 1.25rem/1 system-ui, sans-serif;
        cursor: pointer;
      }
      button:disabled {
        background: #3a434b;
        color: var(--muted);
        cursor: not-allowed;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        margin: 1.25rem 0 0;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: rgb(0 0 0 / 0.55);
        font: 14px/1.4 ui-monospace, monospace;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
    </style>
    <script type="module" src="__XR_TEST_JS__"></script>
  </head>
  <body>
    <main>
      <h1>iynkware XR deploy test</h1>
      <p>Checks that this host serves a WebXR page with the right headers. Enter, then pinch or pull a trigger to recolour the cube.</p>
      <button id="enter" type="button" disabled>Checking…</button>
      <dl id="status"></dl>
    </main>
  </body>
</html>
