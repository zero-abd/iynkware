<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>iynkware</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2efe7; color: #231e16; font-family: system-ui, sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      #shell { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 40; pointer-events: none; padding: 0 16px; }
      #shell > * { pointer-events: auto; }
      #shell button { min-height: 48px; font: inherit; font-size: 20px; padding: 10px 28px; border-radius: 14px; border: 3px solid #231e16; color: #231e16; cursor: pointer; box-shadow: 4px 4px 0 #41538f; }
      #enter { background: #e4694e; }
      #flat { background: #f2efe7; }
      #shell button[disabled] { opacity: 0.5; cursor: default; }
      #shell button:focus-visible { outline: 3px solid #1d4fd8; outline-offset: 3px; }
      #status { font-size: 15px; background: #f2efe7; padding: 6px 12px; border-radius: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="shell">
      <button id="enter" type="button">Enter</button>
      <button id="flat" type="button">Open on this screen</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/shell/entry/index.ts"></script>
  </body>
</html>
