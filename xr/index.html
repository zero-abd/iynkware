<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>iynkware</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2efe7; color: #231e16; font-family: system-ui, sans-serif; }
      #scene-container { position: fixed; inset: 0; }
      #shell { position: fixed; left: 0; right: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 1; pointer-events: none; padding: 0 16px; }
      #shell > * { pointer-events: auto; }
      #enter { font-size: 22px; padding: 12px 32px; border-radius: 14px; border: 3px solid #231e16; background: #ffd23f; color: #231e16; cursor: pointer; }
      #enter[disabled] { opacity: 0.5; }
      #status { font-size: 14px; background: rgba(242, 239, 231, 0.85); padding: 4px 10px; border-radius: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="shell">
      <button id="enter" type="button" disabled>Loading</button>
      <div id="status">Starting</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
